<!doctype html>
<html lang="pt-BR" style="background-color: #000000;">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Seven Gold | Painel de Atendimento</title>
    <link rel="icon" href="assets/icons/seven-gold-g7.png?v=ms9y0on6" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet" />
    <link rel="stylesheet" href="atendimento.css?v=ms9y0on6" />
    <link rel="stylesheet" href="simulador-propostas.css?v=ms9y0on6" />
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#000000" />
  </head>
  <body data-require-auth data-login-page="index.html" data-role-source="crm-users">
    <div class="service-shell" style="display: block; width: 100%; min-height: 100vh;">
      <main class="service-content" style="padding: 0;">
        <header class="service-header" style="border-bottom: 2px solid #C9A84C; padding: 14px 24px; display: flex; align-items: center; justify-content: space-between; gap: 20px; flex-wrap: wrap; border-radius: 0;">
          <div class="sidebar-bubble-bg" aria-hidden="true">
            <div class="sidebar-bubble"></div>
            <div class="sidebar-bubble"></div>
            <div class="sidebar-bubble"></div>
            <div class="sidebar-bubble"></div>
            <div class="sidebar-bubble"></div>
            <div class="sidebar-bubble"></div>
          </div>
          <div class="service-header-brand" style="display: flex; align-items: center; gap: 14px;">
            <a href="painel.html" style="text-decoration: none; display: flex; align-items: center; gap: 12px;">
              <img src="assets/icons/seven-gold-g7.png?v=ms9y0on6" alt="Seven Gold" class="service-header-logo" style="width: 58px; height: 58px; border-radius: 14px; border: 1.5px solid #d4af37;" />
            </a>
            <div class="service-header-vdivider" style="width: 1px; height: 32px; background: rgba(255, 255, 255, 0.15);"></div>
            <div class="service-header-titles">
              <p class="eyebrow" style="margin: 0; font-size: 0.68rem; font-weight: 800; color: #d4af37; letter-spacing: 0.1em;">PAINEL DE ATENDIMENTO</p>
            </div>
          </div>

          <nav class="simulador-topbar-tabs-nav" id="simulador-topbar-nav">
            <button type="button" class="simulador-tab-btn active" data-subtab="simulacao">
              <i data-lucide="calculator"></i> Simulação
            </button>
            <button type="button" class="simulador-tab-btn" data-subtab="propostas" id="topbar-btn-propostas">
              <i data-lucide="file-text"></i> Propostas
            </button>
            <button type="button" class="simulador-tab-btn" data-subtab="clientes" id="topbar-btn-clientes">
              <i data-lucide="users"></i> Clientes
            </button>
            <button type="button" class="simulador-tab-btn" data-subtab="configuracoes" id="topbar-btn-config" style="display: none;">
              <i data-lucide="settings"></i> Configurações
            </button>
          </nav>

          <div style="display: flex; align-items: center; gap: 16px; flex-wrap: wrap;">
            <div class="service-user-actions" style="display: flex; align-items: center; gap: 10px;">
              <a href="painel.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(255, 255, 255, 0.08); border: 1px solid rgba(255, 255, 255, 0.15); border-radius: 8px; color: #f8fafc; font-size: 0.78rem; font-weight: 700; text-decoration: none;">
                <i data-lucide="arrow-left" style="width: 14px; height: 14px;"></i>
                <span>Voltar aos Painéis</span>
              </a>
              <button type="button" data-logout data-logout-redirect="index.html" style="display: inline-flex; align-items: center; gap: 6px; padding: 8px 14px; background: rgba(239, 68, 68, 0.12); border: 1px solid rgba(239, 68, 68, 0.3); border-radius: 8px; color: #ef4444; font-size: 0.78rem; font-weight: 700; cursor: pointer;">
                <i data-lucide="log-out" style="width: 14px; height: 14px;"></i>
                <span>Sair</span>
              </button>
            </div>
          </div>
        </header>

        <div style="padding: 24px 32px; max-width: 1760px; margin: 0 auto;">
          <section class="service-tab-content" data-service-tab-content="simulador" style="display:block;"></section>
          <section class="service-tab-content" data-service-tab-content="proposta-final" style="display:none;" id="proposta-final-container"></section>
        </div>
      </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
    <script src="https://unpkg.com/lucide@0.468.0/dist/umd/lucide.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-config.js"></script>
    <script src="auth.js?v=ms9y0on6"></script>
    <script src="simulador-propostas.js?v=ms9y0on6"></script>
    <script>
      (function() {
        const tabs = document.querySelectorAll('[data-service-tab]');
        tabs.forEach(tab => {
          tab.addEventListener('click', (e) => {
            tabs.forEach(t => t.classList.remove('active'));
            tab.classList.add('active');
            const target = tab.dataset.serviceTab;
            document.querySelectorAll('[data-service-tab-content]').forEach(c => {
              c.style.display = c.dataset.serviceTabContent === target ? 'block' : 'none';
            });
          });
        });
        if (window.lucide) lucide.createIcons();
      })();
    </script>
    <script src="/pwa.js"></script>
    <script src="activation-table-guard.js?v=ms9y0on6"></script>
  </body>
</html>
